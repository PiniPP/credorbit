name: ✨ Feature request
description: Suggest an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: {label: Problem, description: What are you trying to do and what gets in the way?}
    validations: {required: true}
  - type: textarea
    id: proposal
    attributes: {label: Proposed solution}
  - type: dropdown
    id: area
    attributes: {label: Area, options: [TUI, CLI, SSO / login, Profile sync, Credentials export, Account groups, Claude / Bedrock rotation, Corporate network / CA, Packaging, Docs]}
