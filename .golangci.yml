version: "2"
linters:
  default: standard
  settings:
    errcheck:
      # Terminal/report writes: a failed write to stdout/stderr has no useful recovery.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
  exclusions:
    presets:
      - std-error-handling
    rules:
      # Test cleanup (Close/Chmod/WriteFile of fixtures) may ignore errors.
      - path: _test\.go
        linters: [errcheck]
